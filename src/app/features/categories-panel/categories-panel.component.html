@if (categoriesFormsService.$isCreating()) {
  <div data-qa="category-creation-button-form" class="creation-button-form">
    <form class="form-container" [formGroup]="categoriesFormsService.$categoryCreationForm()"
          (ngSubmit)="saveCategory()"
          data-qa="category-panel-category-creation-form">
      <div class="input" data-qa="category-title">
        <div [class.missing-input]="categoriesFormsService.$categoryCreationForm().controls['name'].invalid"
             class="category-detail-input"
             data-qa="category-panel-category-title-input">
          <i class="pi pi-plus creation-icon"></i>
          <input
            type="text"
            pInputText
            inputId="create-category"
            [autofocus]="true"
            (keydown.enter)="saveCategory()"
            placeholder="Category"
            class="text-input"
            formControlName="name"
          />

          <!--        [appCharacterLimit]="categoryPanelConstants().categoryEditInputMaxLength"-->
        </div>
      </div>
      <p-dropdown
        [options]="categoryTypesOptions"
        [(ngModel)]="selectedCategory"
        placeholder="Select Category Type">
      </p-dropdown>
      <div class="buttons" data-qa="category-panel-category-creation-buttons">
        <p-button
          [disabled]="categoriesFormsService.$categoryCreationForm().invalid"
          [label]="'Confirm'"
          (onClick)="saveCategory()"
          type="submit"
          data-qa="category-panel-button-confirm-creation"></p-button>
        <p-button
          (onClick)="cancelCreation($event)"
          [label]="'Cancel'"
          data-qa="category-panel-button-cancel-creation"></p-button>
      </div>
    </form>
  </div>
} @else {
  <div class="cursor-pointer create-button" (click)="setCreating()">
    <i class="pi pi-plus creation-icon"></i>
    <div>{{ 'Create Category' }}</div>
  </div>
}

<div class="saved-categories">
  <h3>Saved Categories:</h3>
  <ul>
    @for (category of categoriesList; track category.name ) {
    <li>
      {{ category.name }} - {{ category.categoryType }}
    </li>
    }
  </ul>
</div>
